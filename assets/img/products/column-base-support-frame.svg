<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Column Base Support Frame — dimension schematic</title>
  <desc id="dsc">Channel frame used as the fixed support in erection of a glass column, supplied with fully threaded jacking rods and U bolts. Pitch circle diameter PCD, frame L by L1 and height H.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <path class="ctr" d="M220 30V300"/><path class="ctr" d="M60 158H380"/>
  <circle class="ext" cx="220" cy="158" r="78"/>
  <path class="line" d="M186 30h68v88h-68z"/>
  <path class="metal" d="M150 118h140v26H150z"/>
  <circle class="body" cx="176" cy="131" r="7"/>
  <circle class="body" cx="264" cy="131" r="7"/>
  <path class="metal" d="M92 186h256v22H92z"/>
  <path class="metal" d="M92 208h20v46H92zM328 208h20v46h-20z"/>
  <path class="line" d="M132 144v44M308 144v44"/>
  <rect class="metal" x="126" y="140" width="14" height="10" rx="2"/>
  <rect class="metal" x="300" y="140" width="14" height="10" rx="2"/>
  <path class="dim" d="M92 278h256"/><text class="t" x="212" y="298">L1</text>
  <path class="ext" d="M92 258v24M348 258v24"/>
  <path class="dim" d="M142 131h156"/><text class="s" x="204" y="112">PCD</text>
  <path class="dim" d="M376 186V254"/><text class="t" x="384" y="226">H</text>
  <path class="ext" d="M350 186h30M350 254h30"/>
  <text class="s" x="66" y="176">Jacking rod</text>
  <text class="s" x="252" y="60">Glass column</text>
</svg>
