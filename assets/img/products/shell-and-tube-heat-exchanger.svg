<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Shell &amp; Tube Heat Exchanger — dimension schematic</title>
  <desc id="dsc">Shell and tube heat exchanger with a baffled tube bundle and four nozzles. Shell bore DN, nozzles DN1 to DN4 and overall length L.</desc>
