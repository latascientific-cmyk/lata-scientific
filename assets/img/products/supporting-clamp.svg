  <circle class="body" cx="152" cy="150" r="7"/>
  <circle class="body" cx="288" cy="150" r="7"/>
  <circle class="body" cx="220" cy="56" r="7"/>
  <path class="metal" d="M186 160h20v130h-20zM234 160h20v130h-20z"/>
