<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Structure Unequal Bracket — dimension schematic</title>
  <desc id="dsc">Cast iron unequal bracket joining a main structure tube NB to a smaller secondary tube NB1, with a bolt hole for fixing.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <path class="ctr" d="M40 210H400"/><path class="ctr" d="M160 66V310"/>
  <path class="line" d="M50 182h280M50 238h280"/><path class="line" d="M50 182v56M330 182v56"/>
  <rect class="metal" x="110" y="168" width="100" height="84" rx="6"/>
  <rect class="metal" x="142" y="100" width="36" height="70" rx="4"/>
  <rect class="metal" x="132" y="88" width="56" height="14" rx="4"/>
  <circle class="metal" cx="250" cy="210" r="22"/>
  <circle class="body" cx="250" cy="210" r="8"/>
  <rect class="metal" x="208" y="200" width="22" height="20" rx="3"/>
  <path class="dim" d="M110 296h100"/><text class="t" x="152" y="316">L</text>
  <path class="ext" d="M110 256v44M210 256v44"/>
  <path class="dim" d="M132 58h56"/><text class="s" x="150" y="52">L1</text>
  <path class="ext" d="M132 62v24M188 62v24"/>
  <path class="dim" d="M362 88V168"/><text class="t" x="370" y="132">h</text>
  <path class="ext" d="M190 88h176M212 168h152"/>
  <text class="s" x="68" y="172">NB</text>
  <text class="s" x="196" y="82">NB1</text>
</svg>
