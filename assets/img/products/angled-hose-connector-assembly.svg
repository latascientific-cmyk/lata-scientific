<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Angled Hose Connector Assembly — dimension schematic</title>
  <desc id="dsc">Angled hose connector for joining flexible hose to a condenser, supplied with a metal flange, rubber gasket and nut bolt. Connection DN, hose spigot d and length L.</desc>
