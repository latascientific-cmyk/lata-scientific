<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Glass to Metal Adaptor Plate — dimension schematic</title>
  <desc id="dsc">PTFE enveloped adaptor plate used as an interface spacer where a reactor has a curved end nozzle. Bore D, outside diameter D1 and thickness L.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <path class="ctr" d="M18 172H244"/><path class="ctr" d="M131 66V278"/>
  <circle class="metal" cx="131" cy="172" r="74"/>
  <circle class="body" cx="131" cy="172" r="44"/>
  <path class="dim" d="M57 172h148"/><text class="t" x="112" y="166">D1</text>
  <path class="dim" d="M87 292h88"/><text class="s" x="122" y="312">D</text>
  <path class="ext" d="M87 218v78M175 218v78"/>
  <path class="ctr" d="M286 172H430"/>
  <path class="metal" d="M300 100h56v28h-56zM300 216h56v28h-56z"/>
  <path class="body" d="M306 106h44v16h-44zM306 222h44v16h-44z"/>
  <path class="dim" d="M300 82h56"/><text class="s" x="322" y="76">L</text>
  <path class="ext" d="M300 98V86M356 98V86"/>
  <path class="dim" d="M400 100V244"/><text class="t" x="408" y="176">D1</text>
  <path class="ext" d="M358 100h44M358 244h44"/>
  <text class="s" x="270" y="196">Metal ring with rubber</text>
  <text class="s" x="270" y="212">cushion, PTFE enveloped</text>
</svg>
