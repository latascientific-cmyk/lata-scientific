<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Structure Tee — dimension schematic</title>
  <desc id="dsc">Cast iron structure tee clamped on a continuous galvanised tube, with a perpendicular branch socket. Nominal bore NB, height H and overall height H1.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <path class="ctr" d="M30 236H410"/>
  <path class="ctr" d="M200 60V310"/>

  <!-- running galvanised tube, continuous through the fitting -->
  <path class="line" d="M40 212h320M40 260h320"/>
  <path class="line" d="M40 212v48M360 212v48"/>

  <!-- cast iron sleeve clamping the running tube -->
  <rect class="metal" x="138" y="198" width="124" height="76" rx="6"/>

  <!-- perpendicular branch socket -->
  <rect class="metal" x="172" y="104" width="56" height="98" rx="5"/>
  <rect class="metal" x="162" y="92" width="76" height="16" rx="4"/>

  <!-- grub screws -->
  <rect class="metal" x="242" y="150" width="16" height="12" rx="2"/>
  <rect class="metal" x="118" y="228" width="12" height="16" rx="2"/>

  <!-- H : tube axis to top of branch collar -->
  <path class="dim" d="M330 92V236"/><text class="t" x="338" y="168">H</text>
  <path class="ext" d="M238 92h96M262 236h72"/>

  <!-- H1 : overall height of the fitting -->
  <path class="dim" d="M386 92V274"/><text class="t" x="394" y="188">H1</text>
  <path class="ext" d="M334 274h58"/>

  <!-- NB callouts -->
  <text class="s" x="186" y="84">NB</text>
  <text class="s" x="58" y="204">NB</text>
  <path class="dim" d="M138 306h124"/><text class="s" x="188" y="326">L</text>
  <path class="ext" d="M138 276v34M262 276v34"/>
</svg>
