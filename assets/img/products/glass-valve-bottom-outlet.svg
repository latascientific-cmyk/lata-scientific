<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Bottom Outlet Valve — dimension schematic</title>
  <desc id="dsc">Borosilicate glass bottom outlet valve mounted under a vessel. Vessel connection DN, side outlet DN1, bottom outlet DN2, overall length L, seat length L1 and width across B.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <path class="ctr" d="M230 40V330"/>
  <!-- vessel bottom -->
  <path class="ext" d="M120 62A140 96 0 0 1 340 62"/>
  <path class="line" d="M150 88h160"/>
  <path class="body" d="M196 88h68v40h-68z"/>
  <!-- main body -->
  <path class="body" d="M176 128h108v92H176z"/>
  <!-- side outlet -->
  <path class="body" d="M284 150h74v34h-74z"/>
  <path class="line" d="M356 144v46"/>
  <!-- bottom outlet cone -->
  <path class="body" d="M196 220h68l-18 62h-32z"/>
  <path class="line" d="M212 282h36"/>
  <!-- spindle through -->
  <path class="line" d="M230 96V300"/>
  <circle class="metal" cx="230" cy="308" r="8"/>
  <path class="dim" d="M96 88V282"/><text class="t" x="76" y="188">L</text>
  <path class="ext" d="M176 88H96M196 282H96"/>
  <path class="dim" d="M410 150V282"/><text class="t" x="420" y="220">L1</text>
  <path class="ext" d="M358 150h52M248 282h162"/>
  <path class="dim" d="M176 340h182"/><text class="t" x="258" y="356">B</text>
  <path class="ext" d="M176 224v120M358 190v150"/>
  <text class="s" x="242" y="80">DN</text>
  <text class="s" x="366" y="176">DN1</text>
  <text class="s" x="252" y="272">DN2</text>
  <path class="dim" d="M196 44h68"/><text class="s" x="224" y="38">d</text>
</svg>
