<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 340" width="470" height="340" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Three Way Valve — dimension schematic</title>
  <desc id="dsc">Borosilicate glass three way valve. Straight run L between DN ends, branch DN1 of length L1, offset L2 and handwheel height H.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <path class="ctr" d="M40 210H430"/><path class="ctr" d="M244 40V300"/>
  <!-- straight run -->
  <path class="body" d="M60 190h140v40H60z"/>
  <path class="body" d="M280 190h120v40H280z"/>
  <path class="line" d="M58 186v48M402 186v48"/>
  <!-- plug body -->
  <path class="body" d="M200 176h84a14 14 0 0 1 0 68h-84z"/>
  <!-- branch down -->
  <path class="body" d="M222 244h44v46h-44z"/>
  <path class="line" d="M216 288h56"/>
  <!-- bonnet up -->
  <path class="body" d="M226 128h36v48h-36z"/>
  
    <rect class="metal" x="231" y="82" width="26" height="46" rx="3"/>
    <rect class="metal" x="222" y="70" width="44" height="13" rx="3"/>
    <path class="line" d="M244 70V54"/>
    <path class="line" d="M218 54h52"/>
    <circle class="metal" cx="244" cy="48" r="7"/>
  <path class="dim" d="M58 316H402"/><text class="t" x="222" y="334">L</text>
  <path class="ext" d="M58 234v86M402 234v86"/>
  <path class="dim" d="M440 60V288"/><text class="t" x="448" y="180">H</text>
  <path class="ext" d="M250 60h190M272 288h168"/>
  <path class="dim" d="M120 288V210"/><text class="t" x="98" y="254">L1</text>
  <path class="ext" d="M216 288H120"/>
  <path class="dim" d="M58 168h186"/><text class="t" x="140" y="162">L2</text>
  <path class="ext" d="M244 174v-12"/>
  <text class="s" x="92" y="182">DN</text>
  <text class="s" x="340" y="182">DN</text>
  <text class="s" x="278" y="282">DN1</text>
  <path class="dim" d="M60 262h140"/><text class="s" x="124" y="258">d</text>
</svg>
