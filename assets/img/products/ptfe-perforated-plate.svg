  <title id="ttl">PTFE Perforated Plate — dimension schematic</title>
  <desc id="dsc">PTFE perforated plate used as a packing retainer in a glass column. Front view showing the perforated face of diameter d, and a side view showing thickness L. DN is the nominal diameter of the column.</desc>
