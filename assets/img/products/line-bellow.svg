<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">PTFE Line Bellow — dimension schematic</title>
  <desc id="dsc">PTFE line bellow for glass to glass service, shown between two bellow flanges with distance locking bolts. Flange outside diameter D, bellow diameter D1, bore D2 and face to face length L.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <path class="ctr" d="M40 178H400"/>

  <!-- bellow flanges -->
  <rect class="metal" x="118" y="72" width="24" height="212" rx="3"/>
  <rect class="metal" x="298" y="72" width="24" height="212" rx="3"/>

  <!-- PTFE convolutions, upper and lower profile -->
  <path class="body" d="M142 122h12v-18h20v18h20v-18h20v18h20v-18h20v18h20v-18h20v18h12v112h-12v18h-20v-18h-20v18h-20v-18h-20v18h-20v-18h-20v18h-20v-18h-12z"/>
  <!-- bore -->
  <path class="line" d="M142 148h156M142 208h156"/>

  <!-- distance locking bolts -->
  <path class="line" d="M112 96h216M112 260h216"/>
  <rect class="metal" x="106" y="88" width="14" height="16" rx="2"/>
  <rect class="metal" x="320" y="88" width="14" height="16" rx="2"/>
  <rect class="metal" x="106" y="252" width="14" height="16" rx="2"/>
  <rect class="metal" x="320" y="252" width="14" height="16" rx="2"/>

  <!-- dimensions -->
  <path class="dim" d="M118 306h204"/><text class="t" x="212" y="326">L</text>
  <path class="ext" d="M118 286v26M322 286v26"/>

  <path class="dim" d="M78 72V284"/><text class="t" x="56" y="182">D</text>
  <path class="ext" d="M116 72H72M116 284H72"/>

  <path class="dim" d="M366 104V252"/><text class="s" x="374" y="182">D1</text>
  <path class="ext" d="M324 104h46M324 252h46"/>

  <path class="dim" d="M232 148V208"/><text class="s" x="238" y="184">D2</text>
</svg>
