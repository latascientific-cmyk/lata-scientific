<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Drain Valve — dimension schematic</title>
  <desc id="dsc">Borosilicate glass drain valve. Vertical run L, branch height H, outlet DN1, bore d and drain outlet diameter D.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <path class="ctr" d="M150 40V300"/><path class="ctr" d="M150 150H400"/>
  <path class="body" d="M128 40h44v92h-44z"/>
  <path class="line" d="M120 42h60"/>
  <path class="body" d="M124 132h52a18 18 0 0 1 18 18v0a18 18 0 0 1-18 18h-52z"/>
  <!-- tapered drain leg -->
  <path class="body" d="M128 168h44l14 100h-72z"/>
  <path class="line" d="M108 270h84"/>
  <path class="body" d="M194 136h96v28h-96z"/>
  <path class="line" d="M290 130h10v40h-10z"/>
  <g transform="rotate(90 330 150)">
    <rect class="metal" x="317" y="104" width="26" height="46" rx="3"/>
    <rect class="metal" x="308" y="92" width="44" height="13" rx="3"/>
    <path class="line" d="M330 92V76"/>
    <path class="line" d="M304 76h52"/>
    <circle class="metal" cx="330" cy="70" r="7"/></g>
  <path class="dim" d="M60 42V270"/><text class="t" x="40" y="162">L</text>
  <path class="ext" d="M120 42H60M108 270H60"/>
  <path class="dim" d="M150 24H396"/><text class="t" x="266" y="18">H</text>
  <path class="ext" d="M396 30V150"/>
  <text class="s" x="186" y="36">DN</text>
  <text class="s" x="300" y="196">DN1</text>
  <path class="dim" d="M128 330h44"/><text class="s" x="142" y="326">d</text>
  <path class="dim" d="M108 292h84"/><text class="t" x="144" y="312">D</text>
  <path class="ext" d="M108 272v24M192 272v24"/>
</svg>
