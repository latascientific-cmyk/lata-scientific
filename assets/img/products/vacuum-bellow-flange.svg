<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Vacuum Bellow Flange — dimension schematic</title>
  <desc id="dsc">Flange for the vacuum bellow range, supplied undrilled or drilled to BS 10 Table E, Table F or ASA 150. Outside diameter D and length L.</desc>
