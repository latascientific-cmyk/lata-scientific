<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">APPS High Pressure Reactor in Glass — assembly schematic</title>
  <desc id="dsc">High pressure reaction vessel in glass with a bolted top closure, stirrer drive, pressure gauge and relief connection. Wetted parts are glass and PTFE only.</desc>
