<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Angle Valve — dimension schematic</title>
  <desc id="dsc">Borosilicate glass angle valve. Horizontal inlet DN of length L, vertical outlet DN1 with handwheel at height H, included angle D of 90 or 80 degrees.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <path class="ctr" d="M40 220H330"/><path class="ctr" d="M300 60V280"/>
  <!-- horizontal inlet -->
  <path class="body" d="M60 200h180v40H60z"/>
  <path class="line" d="M58 196v48"/>
  <!-- corner body -->
  <path class="body" d="M240 194h56a10 10 0 0 1 10 10v42h-66z"/>
  <!-- vertical outlet down -->
  <path class="body" d="M278 246h44v34h-44z"/>
  <path class="line" d="M272 278h56"/>
  <!-- bonnet up -->
  <path class="body" d="M282 150h36v46h-36z"/>
  
    <rect class="metal" x="287" y="104" width="26" height="46" rx="3"/>
    <rect class="metal" x="278" y="92" width="44" height="13" rx="3"/>
    <path class="line" d="M300 92V76"/>
    <path class="line" d="M274 76h52"/>
    <circle class="metal" cx="300" cy="70" r="7"/>
  <path class="dim" d="M58 300H328"/><text class="t" x="188" y="318">L</text>
  <path class="ext" d="M58 246v58M328 250v54"/>
  <path class="dim" d="M390 70V278"/><text class="t" x="400" y="178">H</text>
  <path class="ext" d="M306 70h84M328 278h62"/>
  <text class="s" x="96" y="190">DN</text>
  <text class="s" x="336" y="272">DN1</text>
  <path class="dim" d="M60 262h180"/><text class="s" x="142" y="258">d</text>
  <!-- included angle -->
  <path class="ext" d="M300 220 176 220M300 220 300 120"/>
  <path class="dim" d="M236 220A64 64 0 0 0 300 156"/>
  <text class="t" x="228" y="176">D</text>
</svg>
