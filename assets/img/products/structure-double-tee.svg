<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Structure Double Tee — dimension schematic</title>
  <desc id="dsc">Cast iron double tee branching two members off a continuous structure tube in two planes, without breaking the run.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <path class="ctr" d="M200 24V326"/><path class="ctr" d="M30 214H410"/>
  <path class="line" d="M40 190h320M40 238h320"/><path class="line" d="M40 190v48M360 190v48"/>
  <rect class="metal" x="150" y="176" width="100" height="76" rx="6"/>
  <rect class="metal" x="176" y="96" width="48" height="82" rx="5"/>
  <rect class="metal" x="166" y="84" width="68" height="14" rx="4"/>
  <rect class="metal" x="176" y="250" width="48" height="82" rx="5"/>
  <rect class="metal" x="166" y="332" width="68" height="14" rx="4"/>
  <rect class="metal" x="232" y="200" width="14" height="12" rx="2"/>
  <path class="dim" d="M320 84V214"/><text class="t" x="328" y="152">H</text>
  <path class="ext" d="M234 84h90M250 214h74"/>
  <path class="dim" d="M382 84V346"/><text class="t" x="390" y="218">H1</text>
  <path class="ext" d="M234 346h152"/>
  <text class="s" x="188" y="76">NB</text>
  <text class="s" x="58" y="182">NB</text>
</svg>
