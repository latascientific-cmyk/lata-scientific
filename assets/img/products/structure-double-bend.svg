<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Structure Double Bend — dimension schematic</title>
  <desc id="dsc">Cast iron double bend taking two members off a vertical structure tube at a corner, framing in two planes from one fitting.</desc>
  <defs>
