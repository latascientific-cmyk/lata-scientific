<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Backing Flange — dimension schematic</title>
  <desc id="dsc">Cast iron backing flange, face view and section. Outside diameter D, bore D1, insert seat D2, bolt pitch circle diameter PCD, thickness L and collar L1.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.6 10 5 0 8.4z" fill="#8A8F9A"/>
    </marker>
    <style>
    .body{fill:#F4F8FD;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .line{fill:none;stroke:#2C3340;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .metal{fill:#DCE6F1;stroke:#2C3340;stroke-width:2.2;stroke-linejoin:round}
    .ctr{fill:none;stroke:#1E6BFF;stroke-width:1.1;stroke-dasharray:9 4 2 4;opacity:.65}
    .dim{fill:none;stroke:#8A8F9A;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}
    .ext{fill:none;stroke:#8A8F9A;stroke-width:.8;stroke-dasharray:3 3}
    .t{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#111}
    .s{font-family:ui-sans-serif,system-ui,'Segoe UI',Inter,Arial,sans-serif;font-size:12.5px;fill:#545B68}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- ===== face view ===== -->
  <path class="ctr" d="M18 178H244"/><path class="ctr" d="M131 65V291"/>
  <circle class="metal" cx="131" cy="178" r="86"/>
  <circle class="body" cx="131" cy="178" r="38"/>
  <circle class="ext" cx="131" cy="178" r="62" fill="none"/>
  <!-- bolt holes on the PCD, 6 off -->
  <circle class="body" cx="131" cy="116" r="8"/>
  <circle class="body" cx="185" cy="147" r="8"/>
  <circle class="body" cx="185" cy="209" r="8"/>
  <circle class="body" cx="131" cy="240" r="8"/>
  <circle class="body" cx="77" cy="209" r="8"/>
  <circle class="body" cx="77" cy="147" r="8"/>

  <path class="dim" d="M45 178h172"/><text class="t" x="120" y="172">D</text>
  <path class="dim" d="M93 292h76"/><text class="s" x="122" y="312">D1</text>
  <path class="ext" d="M93 216v80M169 216v80"/>
  <text class="s" x="140" y="106">PCD</text>

  <!-- ===== section view ===== -->
  <path class="ctr" d="M286 178H430"/>
  <!-- upper half section -->
  <path class="metal" d="M300 178v-86h34v18h20v68z"/>
  <!-- lower half section -->
  <path class="metal" d="M300 178v86h34v-18h20v-68z"/>
  <!-- insert seat -->
  <path class="line" d="M334 110h20M334 246h20"/>

  <path class="dim" d="M300 78h54"/><text class="s" x="316" y="72">L</text>
  <path class="ext" d="M300 92V82M354 110V82"/>
  <path class="dim" d="M378 92V110"/><text class="s" x="386" y="108">L1</text>
  <path class="ext" d="M354 92h28M354 110h28"/>
  <path class="dim" d="M410 92V264"/><text class="t" x="416" y="182">D</text>
  <path class="ext" d="M356 264h58"/>
  <text class="s" x="286" y="196">D2</text>
</svg>
